name: V5 PHP contract checks
on:
  push:
    branches:
      - codex/v5-0-vimexx-php
    paths:
      - 'vimexx-v5/**'
      - '.github/workflows/vimexx-v5-php-tests.yml'
  pull_request:
    paths:
      - 'vimexx-v5/**'
      - '.github/workflows/vimexx-v5-php-tests.yml'
  workflow_dispatch:

jobs:
  php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          find vimexx-v5 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Existing validation tests
        run: php vimexx-v5/tests/RequestValidatorTest.php
      - name: V4.8 intake mapping tests
        run: php vimexx-v5/tests/V48IntakeMapperTest.php

      - name: Local HTTP endpoint contract
        run: |
          php -S 127.0.0.1:18743 -t vimexx-v5/public >/tmp/oxx-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:18743/api/aanvragen/; then break; fi
            sleep 0.2
          done
          php vimexx-v5/tests/HttpEndpointTest.php
