name: V5 PHP contract checks
on:
  push:
    branches:
      - codex/v5-0-vimexx-php
    paths:
      - 'vimexx-v5/**'
      - '.github/workflows/vimexx-v5-php-tests.yml'
  pull_request:
    paths:
      - 'vimexx-v5/**'
      - '.github/workflows/vimexx-v5-php-tests.yml'
  workflow_dispatch:

jobs:
  php-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: oxx_intake_test
          MARIADB_USER: oxx_test
          MARIADB_PASSWORD: test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, pdo_mysql
      - name: PHP syntax
        run: |
          find vimexx-v5 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Existing validation tests
        run: php vimexx-v5/tests/RequestValidatorTest.php
      - name: V4.8 intake mapping tests
        run: php vimexx-v5/tests/V48IntakeMapperTest.php

      - name: Local HTTP endpoint contract
        run: |
          php -S 127.0.0.1:18743 -t vimexx-v5/public >/tmp/oxx-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:18743/api/aanvragen/; then break; fi
            sleep 0.2
          done
          php vimexx-v5/tests/HttpEndpointTest.php

      - name: Isolated PDO intake storage tests
        run: php vimexx-v5/tests/IntakeRepositoryTest.php

      - name: Isolated MariaDB 11.4 integration
        env:
          OXX_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=oxx_intake_test;charset=utf8mb4
          OXX_TEST_MYSQL_USER: oxx_test
          OXX_TEST_MYSQL_PASSWORD: test-only
        run: php vimexx-v5/tests/MysqlIntakeIntegrationTest.php

      - name: HTTPS same-origin security checks
        run: php vimexx-v5/tests/OriginPolicyTest.php

      - name: Isolated MariaDB rate-limit checks
        env:
          OXX_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=oxx_intake_test;charset=utf8mb4
          OXX_TEST_MYSQL_USER: oxx_test
          OXX_TEST_MYSQL_PASSWORD: test-only
        run: php vimexx-v5/tests/MysqlRateLimiterTest.php

      - name: Visitor HMAC privacy and spoofing checks
        run: php vimexx-v5/tests/VisitorKeyTest.php

      - name: Combined visitor HMAC and MariaDB rate-limit integration
        env:
          OXX_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=oxx_intake_test;charset=utf8mb4
          OXX_TEST_MYSQL_USER: oxx_test
          OXX_TEST_MYSQL_PASSWORD: test-only
        run: php vimexx-v5/tests/MysqlVisitorRateLimitIntegrationTest.php

      - name: Combined intake gate security integration
        env:
          OXX_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=oxx_intake_test;charset=utf8mb4
          OXX_TEST_MYSQL_USER: oxx_test
          OXX_TEST_MYSQL_PASSWORD: test-only
        run: php vimexx-v5/tests/MysqlIntakeGateTest.php
